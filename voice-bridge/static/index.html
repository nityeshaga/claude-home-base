<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120F0D">
<title>__AGENT_NAME__ · the line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #120F0D;            /* the study after the overheads are off */
    --bg-warm: #1C1917;
    --paper: #E7E5E4;
    --paper-dim: #A8A29E;
    --pencil: #78716C;
    --amber: #D4A574;
    --amber-hot: #F2C48D;
    --ember: #B8673A;
    --border: #2D2926;
    --green: #86EFAC;
    --font-display: 'Fraunces', Literata, Georgia, serif;
    --font-prose: 'Literata', Georgia, serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    --lamp: 0;   /* 0..1 assistant speaking energy */
    --mic: 0;    /* 0..1 caller energy */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  @supports (height: 100dvh) { body { min-height: 100dvh; height: 100dvh; } }
  body {
    background: var(--bg); color: var(--paper);
    font-family: var(--font-prose); -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
  }
  /* paper grain, same crosshatch as the study */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .035;
    background-image: url("data:image/svg+xml,%3Csvg width='8' height='8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l8 8M8 0l-8 8' stroke='%23E7E5E4' stroke-width='0.5'/%3E%3C/svg%3E");
    background-size: 8px 8px;
  }
  /* the pool of lamplight on the desk, breathes with the assistant's voice */
  #light {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, rgba(212,165,116, calc(.10 + var(--lamp) * .22)) 0%, rgba(212,165,116,0) 70%),
      radial-gradient(ellipse 90% 70% at 50% 40%, rgba(184,103,58, calc(.05 + var(--lamp) * .06)) 0%, rgba(18,15,13,0) 75%);
    transition: background 120ms linear;
  }

  /* ---------- top: the nameplate ---------- */
  header {
    position: relative; z-index: 2;
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 26px 32px 0; gap: 20px;
    animation: rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  header .name { font-family: var(--font-display); font-weight: 300; font-size: 22px; letter-spacing: .01em; color: var(--paper); }
  header .name em { font-style: italic; color: var(--amber); }
  header .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--pencil); display: flex; gap: 18px; align-items: center; }
  header .meta #timer { color: var(--paper-dim); letter-spacing: .08em; text-transform: none; font-variant-numeric: tabular-nums; }
  header .meta a { color: var(--pencil); text-decoration: none; border-bottom: 1px solid transparent; }
  header .meta a:hover { color: var(--amber); border-bottom-color: var(--amber); }

  /* ---------- middle: the lamp and the script ---------- */
  main {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
    gap: 40px; padding: 20px 32px 0; overflow: hidden; align-items: stretch;
  }

  /* the lamp: one object on the desk */
  #lamp-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; min-height: 360px; }
  #lamp {
    position: relative; width: 240px; height: 240px; border-radius: 50%; cursor: pointer; border: 0; outline: none;
    background:
      radial-gradient(circle at 50% 42%, var(--amber-hot) 0%, var(--amber) 38%, var(--ember) 78%, #6E3B22 100%);
    box-shadow:
      0 0 0 1px rgba(242,196,141,.25),
      0 0 calc(40px + var(--lamp) * 90px) calc(6px + var(--lamp) * 24px) rgba(212,165,116, calc(.22 + var(--lamp) * .35)),
      inset 0 -30px 60px rgba(60,25,10,.55), inset 0 18px 40px rgba(255,235,205,.28);
    transition: transform .6s cubic-bezier(.2,.7,.2,1), filter .6s ease;
    animation: rise 1.1s .15s cubic-bezier(.2,.7,.2,1) both, idle-breathe 6s 1.2s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  #lamp:hover { transform: scale(1.02); }
  #lamp:active { transform: scale(.985); }
  body.live #lamp { animation: rise 1.1s .15s cubic-bezier(.2,.7,.2,1) both; transform: scale(calc(1 + var(--lamp) * .06)); transition: transform 90ms linear; }
  body.ended #lamp { filter: saturate(.6) brightness(.8); }
  body.reconnecting #lamp { filter: saturate(.7) brightness(.85); }
  body.reconnecting #state .dot { background: var(--amber); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes idle-breathe { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.08); } }
  /* the caller's own voice: a thin ring that widens as you speak */
  #lamp::after {
    content: ''; position: absolute; inset: calc(-14px - var(--mic) * 26px); border-radius: 50%;
    border: 1px solid rgba(231,229,228, calc(.12 + var(--mic) * .5));
    transition: inset 80ms linear, border-color 80ms linear; pointer-events: none;
  }
  /* rings that ripple outward while the assistant speaks */
  #rings { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; }
  #rings span { position: absolute; width: 240px; height: 240px; border-radius: 50%; border: 1px solid rgba(212,165,116,.35); opacity: 0; }
  body.speaking #rings span { animation: ripple 2.4s linear infinite; }
  body.speaking #rings span:nth-child(2) { animation-delay: .8s; }
  body.speaking #rings span:nth-child(3) { animation-delay: 1.6s; }
  @keyframes ripple { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(2.1); opacity: 0; } }

  #lamp .label {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--font-display); font-style: italic; font-weight: 300; font-size: 22px; color: #2A1409;
    letter-spacing: .01em; text-shadow: 0 1px 0 rgba(255,240,220,.35);
    transition: opacity .4s ease;
  }
  body.live #lamp .label { opacity: 0; }

  #state {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--pencil);
    display: flex; align-items: center; gap: 10px; min-height: 18px;
    animation: rise 1s .3s cubic-bezier(.2,.7,.2,1) both;
  }
  #state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pencil); }
  body.live #state .dot { background: var(--green); box-shadow: 0 0 10px rgba(134,239,172,.6); }
  body.thinking #state .dot { background: var(--amber); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* controls under the lamp */
  #controls { display: flex; gap: 10px; align-items: center; min-height: 40px; animation: rise 1s .4s cubic-bezier(.2,.7,.2,1) both; }
  .pill {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--paper-dim);
    cursor: pointer; transition: border-color .2s, color .2s, background .2s;
  }
  .pill:hover { border-color: var(--amber); color: var(--amber); }
  .pill.danger:hover { border-color: #C2634F; color: #E08573; }
  .pill.on { border-color: var(--amber); color: var(--amber); }
  body:not(.live) .live-only { display: none; }
  body.live .idle-only, body.live #callers { display: none; }

  /* voice chips: choose who answers */
  #callers { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 380px; animation: rise 1s .5s cubic-bezier(.2,.7,.2,1) both; }
  #callers .lead { flex-basis: 100%; text-align: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--pencil); margin-bottom: 4px; }
  .chip {
    font-family: var(--font-mono); font-size: 11px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); color: var(--pencil); background: transparent; transition: all .15s;
  }
  .chip:hover { color: var(--paper-dim); border-color: var(--pencil); }
  .chip.on { color: var(--amber); border-color: var(--amber); background: rgba(212,165,116,.08); }

  /* the script: what has been said */
  #script-col { position: relative; min-height: 0; display: flex; flex-direction: column; }
  #script-col::before { /* fade the older lines into the dark, like the top of a page in lamplight */
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 90px; z-index: 2; pointer-events: none;
    background: linear-gradient(var(--bg), rgba(18,15,13,0));
  }
  #script { flex: 1; overflow-y: auto; padding: 60px 8px 40px 0; scrollbar-width: none; mask-image: linear-gradient(to bottom, transparent, black 80px, black 92%, transparent); }
  #script::-webkit-scrollbar { display: none; }
  #script { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scroll-behavior: smooth; }
  #latest { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 12px); z-index: 3; opacity: 0; pointer-events: none;
    background: var(--bg); transition: opacity .25s ease, transform .25s ease; }
  #latest.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  #script .empty { font-family: var(--font-display); font-style: italic; font-weight: 300; font-size: 20px; color: var(--pencil); max-width: 34ch; line-height: 1.5; margin-top: 30%; animation: rise 1s .6s cubic-bezier(.2,.7,.2,1) both; }
  #script .empty small { display: block; font-family: var(--font-mono); font-style: normal; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-top: 18px; color: var(--pencil); opacity: .8; }
  .line { display: grid; grid-template-columns: 64px 1fr; gap: 16px; margin: 0 0 18px; max-width: 62ch; animation: fadein .35s ease both; }
  .line .who { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--pencil); padding-top: 6px; text-align: right; }
  .line .t { font-size: 17px; line-height: 1.6; color: var(--paper-dim); }
  .line.agent .t { color: var(--paper); }
  .line.agent .who { color: var(--amber); opacity: .85; }
  .line.partial .t::after { content: '▍'; color: var(--amber); opacity: .6; margin-left: 2px; animation: pulse 1s infinite; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- bottom: the margin note ---------- */
  footer {
    position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 32px 22px; font-family: var(--font-mono); font-size: 11px; color: var(--pencil); letter-spacing: .04em;
  }
  footer #thread { display: none; }
  body.live footer #thread, body.ended footer #thread { display: inline; }
  footer a { color: var(--paper-dim); text-decoration: none; border-bottom: 1px solid var(--border); }
  footer a:hover { color: var(--amber); border-bottom-color: var(--amber); }

  /* ---------- the phone in your hand ---------- */
  @media (max-width: 820px) {
    header { padding: 14px 20px 0; align-items: center; }
    header .name { font-size: 20px; }
    header .meta { gap: 12px; font-size: 10px; }
    main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 6px; padding: 6px 20px 0; }
    #lamp-col { min-height: 0; gap: 14px; padding-top: 14px; justify-content: flex-start; }
    #lamp, #rings span { width: 150px; height: 150px; }
    #lamp .label { font-size: 18px; }
    #lamp::after { inset: calc(-9px - var(--mic) * 16px); }
    body.live #lamp, body.live #rings span { width: 120px; height: 120px; }
    body.live #lamp { transition: width .5s cubic-bezier(.2,.7,.2,1), height .5s cubic-bezier(.2,.7,.2,1), transform 90ms linear; }
    #state { font-size: 11px; letter-spacing: .12em; }
    #controls { min-height: 0; }
    .pill { padding: 8px 14px; font-size: 10.5px; }
    #callers { max-width: 100%; gap: 5px; }
    .chip { font-size: 10.5px; padding: 4px 9px; }
    #script-col::before { display: none; }
    #script { padding: 10px 0 16px; mask-image: none; }
    #script .empty { margin-top: 6px; font-size: 17px; max-width: none; }
    #script .empty small { display: none; }
    .line { grid-template-columns: 38px 1fr; gap: 10px; margin-bottom: 14px; max-width: none; }
    .line .who { font-size: 9.5px; padding-top: 5px; }
    .line .t { font-size: 15.5px; line-height: 1.55; }
    footer { padding: 6px 20px calc(12px + env(safe-area-inset-bottom)); font-size: 10px; }
    footer #foot-left { display: none; }
    body.live footer, body.ended footer { justify-content: flex-end; }
  }
  @media (max-height: 560px) {  /* landscape phone (often wider than 820px): lamp beside the script */
    header { padding: 10px 20px 0; }
    main { grid-template-columns: 200px 1fr; grid-template-rows: minmax(0, 1fr); gap: 20px; padding: 4px 20px 0; }
    #lamp-col { min-height: 0; gap: 10px; justify-content: center; }
    #lamp, #rings span, body.live #lamp, body.live #rings span { width: 110px; height: 110px; }
    #lamp .label { font-size: 16px; }
    #lamp::after { inset: calc(-7px - var(--mic) * 12px); }
    #callers { display: none; }
    .pill { padding: 7px 12px; font-size: 10px; }
    #script-col::before { display: none; }
    #script { padding: 6px 0 10px; mask-image: none; }
    #script .empty { margin-top: 4px; font-size: 16px; } #script .empty small { display: none; }
    .line { grid-template-columns: 38px 1fr; gap: 10px; margin-bottom: 10px; } .line .t { font-size: 15px; line-height: 1.5; }
    footer { padding: 4px 20px 10px; font-size: 10px; } footer #foot-left { display: none; }
  }
</style>
</head>
<body>
<div id="light"></div>
<header>
  <div class="name">__AGENT_NAME__</div>
  <div class="meta"><span id="timer"></span><span id="callername"></span></div>
</header>

<main>
  <section id="lamp-col">
    <div style="position:relative; display:grid; place-items:center;">
      <div id="rings"><span></span><span></span><span></span></div>
      <button id="lamp" aria-label="Pick up"><span class="label">pick up</span></button>
    </div>
    <div id="state"><span class="dot"></span><span id="state-text">the line is quiet</span></div>
    <div id="controls">
      <button class="pill live-only" id="mute">mute</button>
      <button class="pill live-only danger" id="hang">hang up</button>
    </div>
    <div id="callers" class="idle-only"><span class="lead">who's calling</span></div>
  </section>

  <section id="script-col">
    <button id="latest" class="pill">↓ latest</button>
    <div id="script">
      <div class="empty" id="empty">Pick up, and speak as you would across a desk. Anything worth keeping lands in Slack while we talk.
        <small>chrome or safari · mic permission · one call at a time</small></div>
    </div>
  </section>
</main>

<footer>
  <span id="foot-left"></span>
  <span id="thread"><a id="thread-link" href="#" target="_blank" rel="noopener">this call's thread ↗</a></span>
</footer>

<script>
const RATE = 24000;
const $ = id => document.getElementById(id);
const root = document.documentElement;
let ws, ctx, workletNode, micStream, playhead = 0, muted = false, startedAt = 0, timerIv;
let outAnalyser, micAnalyser, outGain, raf;
const voice = 'stone';
const AGENT = __AGENT_JSON__;                 // filled in by bridge.py from VOICE_AGENT_NAME
const CALLERS = __CALLERS_JSON__;             // filled in by bridge.py from callers.json
const WHO = AGENT.split(' ')[0].toLowerCase();  // short label in the transcript margin
$('foot-left').textContent = location.host + ' · gpt-live-1 → claude';
for (const [id, name] of Object.entries(CALLERS)) {
  const b = document.createElement('button'); b.className = 'chip caller'; b.dataset.user = id; b.textContent = name.toLowerCase();
  $('callers').appendChild(b);
}
let user = new URLSearchParams(location.search).get('user') || localStorage.getItem('voice-caller') || '';
function paintCaller() {
  document.querySelectorAll('.chip.caller').forEach(c => c.classList.toggle('on', c.dataset.user === user));
  $('callername').textContent = user ? 'for ' + CALLERS[user] : '';
}
document.querySelectorAll('.chip.caller').forEach(c => c.onclick = () => { user = c.dataset.user; localStorage.setItem('voice-caller', user); paintCaller(); });

/* one voice, fixed on the page; the bridge still accepts ?voice= for experiments */
paintCaller();

/* ---- state helpers ---- */
function setState(text, cls) {
  $('state-text').textContent = text;
  document.body.classList.toggle('thinking', cls === 'thinking');
}
/* tool names → what a person would say they're doing */
function verb(tool) {
  const t = tool.toLowerCase();
  if (/postgres|render|sql|database/.test(t)) return 'checking production…';
  if (/gmail|mail/.test(t)) return 'reading email…';
  if (/calendar/.test(t)) return 'checking the calendar…';
  if (/slack/.test(t)) return 'reading slack…';
  if (/websearch|webfetch|fetch|browser/.test(t)) return 'looking it up…';
  if (/^(read|grep|glob|ls)$/.test(t)) return 'reading…';
  if (/^(edit|write|notebookedit)$/.test(t)) return 'writing…';
  if (/^(bash|toolsearch|agent|task)$/.test(t)) return 'working on it…';
  if (/basecamp/.test(t)) return 'checking basecamp…';
  return 'working on it…';
}
function fmt(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }

/* ---- transcript ---- */
/* One block per speaker turn. Consecutive sentences from the same voice join the same
   paragraph, the way a script reads. Scrolling follows the newest line unless you scroll
   away; then it leaves you alone and offers a way back. */
const partial = {};
let lastRole = null, lastBlock = null, ended = false, following = true, scrollRaf = 0;
const scriptEl = $('script');
function nearBottom() { return scriptEl.scrollHeight - scriptEl.scrollTop - scriptEl.clientHeight < 48; }
function follow() {
  if (!following || scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = 0;
    scriptEl.scrollTo({ top: scriptEl.scrollHeight, behavior: 'smooth' });
  });
}
let userScrolling = false, scrollIdle;
scriptEl.addEventListener('scroll', () => {
  // a scroll the user made can switch follow mode off; reaching the bottom always switches it on
  if (userScrolling) following = nearBottom();
  else if (nearBottom()) following = true;
  $('latest').classList.toggle('show', !following);
}, { passive: true });
for (const ev of ['touchstart', 'wheel', 'pointerdown']) scriptEl.addEventListener(ev, () => { userScrolling = true; clearTimeout(scrollIdle); scrollIdle = setTimeout(() => userScrolling = false, 1200); }, { passive: true });
$('latest').onclick = () => { userScrolling = false; clearTimeout(scrollIdle); following = true; $('latest').classList.remove('show'); follow(); };

function showLine(role, text, isPartial) {
  if (ended) return;
  $('empty')?.remove();
  let el = partial[role];
  if (!el) {
    const other = role === 'you' ? 'agent' : 'you';
    if (partial[other]) { partial[other].classList.remove('partial'); delete partial[other]; }
    if (lastRole === role && lastBlock) {
      el = lastBlock; el.dataset.done = el.querySelector('.t').textContent + ' ';
    } else {
      el = document.createElement('div'); el.className = 'line ' + role; el.dataset.done = '';
      el.innerHTML = `<span class="who">${role === 'you' ? 'you' : WHO}</span><span class="t"></span>`;
      scriptEl.appendChild(el);
    }
    partial[role] = el; lastRole = role; lastBlock = el;
  }
  el.querySelector('.t').textContent = el.dataset.done + text;
  el.classList.toggle('partial', !!isPartial);
  if (!isPartial || /[.!?]\s*$/.test(text)) { el.classList.remove('partial'); delete partial[role]; }
  follow();
}
function replayTranscript(lines) {
  scriptEl.querySelectorAll('.line').forEach(e => e.remove());
  lastRole = null; lastBlock = null; Object.keys(partial).forEach(k => delete partial[k]);
  for (const [role, text] of lines) showLine(role === 'caller' ? 'you' : 'agent', text, false);
}

/* ---- audio ---- */
const workletCode = `
class PCM extends AudioWorkletProcessor {
  constructor(){ super(); this.buf = []; this.n = 0; }
  process(inputs){
    const ch = inputs[0][0]; if (!ch) return true;
    const out = new Int16Array(ch.length);
    for (let i=0;i<ch.length;i++){ const s = Math.max(-1, Math.min(1, ch[i])); out[i] = s < 0 ? s*0x8000 : s*0x7fff; }
    this.buf.push(out); this.n += out.length;
    if (this.n >= 2400) {
      const all = new Int16Array(this.n); let o=0; for (const b of this.buf){ all.set(b,o); o+=b.length; }
      this.port.postMessage(all.buffer, [all.buffer]); this.buf = []; this.n = 0;
    }
    return true;
  }
}
registerProcessor('pcm', PCM);`;

function playPCM(buf) {
  const i16 = new Int16Array(buf), f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 0x8000;
  const ab = ctx.createBuffer(1, f32.length, RATE); ab.getChannelData(0).set(f32);
  const src = ctx.createBufferSource(); src.buffer = ab; src.connect(outGain);
  const now = ctx.currentTime;
  if (playhead < now + 0.05) playhead = now + 0.05;
  src.start(playhead); playhead += ab.duration;
}

function meter(an, data) { an.getByteTimeDomainData(data); let s = 0; for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; s += v * v; } return Math.sqrt(s / data.length); }
function animate() {
  const od = new Uint8Array(outAnalyser.fftSize), md = new Uint8Array(micAnalyser.fftSize);
  let lampLvl = 0, micLvl = 0;
  const tick = () => {
    const o = Math.min(1, meter(outAnalyser, od) * 6), m = Math.min(1, meter(micAnalyser, md) * 5);
    lampLvl += (o - lampLvl) * (o > lampLvl ? .5 : .12);
    micLvl += (m - micLvl) * (m > micLvl ? .5 : .15);
    root.style.setProperty('--lamp', lampLvl.toFixed(3)); root.style.setProperty('--mic', (muted ? 0 : micLvl).toFixed(3));
    document.body.classList.toggle('speaking', lampLvl > .06);
    raf = requestAnimationFrame(tick);
  };
  tick();
}

/* ---- the call ---- */
let callId = null, wantHangup = false, wakeLock = null, reconnectTimer = null;

async function keepAwake() {
  // Screen Wake Lock: the phone stops locking mid-call. Re-acquired whenever we come back to the foreground.
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); } } catch {}
}
async function releaseAwake() { try { await wakeLock?.release(); } catch {} wakeLock = null; }

async function openMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  const src = ctx.createMediaStreamSource(micStream);
  src.connect(workletNode); src.connect(micAnalyser);
}

function connect(resume) {
  const url = `wss://${location.host}/ws?user=${user}&voice=${voice}` + (resume && callId ? `&resume=${callId}` : '');
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    clearTimeout(reconnectTimer); reconnectTimer = null;
    ended = false;
    document.body.classList.add('live'); document.body.classList.remove('ended', 'reconnecting');
    if (!startedAt) {
      lastRole = null; lastBlock = null; startedAt = Date.now();
      timerIv = setInterval(() => $('timer').textContent = fmt(Math.floor((Date.now() - startedAt) / 1000)), 500);
      animate();
    }
    setState('listening'); keepAwake();
  };
  ws.onmessage = ev => {
    if (ev.data instanceof ArrayBuffer) { playPCM(ev.data); return; }
    const m = JSON.parse(ev.data);
    if (m.type === 'transcript') showLine(m.role, m.text, m.partial);
    else if (m.type === 'call') { callId = m.id; if (m.started_ms) { startedAt = Date.now() - m.started_ms; } }
    else if (m.type === 'replay') { replayTranscript(m.lines || []); }
    else if (m.type === 'status') {
      if (m.text === 'connected') setState('listening');
      else if (/thinking/i.test(m.text)) setState('thinking', 'thinking');
      else if (/^tool: /.test(m.text)) setState(verb(m.text.replace(/^tool: /, '').replace(/…$/, '')), 'thinking');
      else if (m.text === 'listening') setState('listening');
      else setState(m.text.toLowerCase());
    }
    else if (m.type === 'thread' && m.url) { $('thread-link').href = m.url; }
    else if (m.type === 'caller' && m.user) { user = m.user; $('callername').textContent = 'for ' + (CALLERS[m.user] || m.name || '').toLowerCase() + (m.via ? ' · ' + m.via : ''); }
    else if (m.type === 'ended') { hangUp(true); }
  };
  ws.onclose = () => {
    if (wantHangup || !startedAt) { hangUp(true); return; }
    // The line dropped (screen lock, network blip). The bridge keeps the call warm for 90 s: get back on it.
    document.body.classList.add('reconnecting'); setState('reconnecting…', 'thinking');
    const deadline = Date.now() + 90000;
    const retry = () => {
      if (wantHangup) return;
      if (Date.now() > deadline) { setState('line dropped'); hangUp(true); return; }
      if (document.visibilityState !== 'visible') { reconnectTimer = setTimeout(retry, 1000); return; }
      try { connect(true); } catch {}
      reconnectTimer = setTimeout(() => { if (ws.readyState !== 1) { try { ws.close(); } catch {} retry(); } }, 2500);
    };
    retry();
  };
  workletNode.port.onmessage = e => { if (ws.readyState === 1 && !muted) ws.send(e.data); };
}

async function pickUp() {
  setState('picking up…');
  wantHangup = false; callId = null; startedAt = 0;
  ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: RATE });
  await ctx.resume();
  if (ctx.sampleRate !== RATE) { setState('this browser will not open audio at 24 khz'); return; }
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletCode], { type: 'application/javascript' })));
  workletNode = new AudioWorkletNode(ctx, 'pcm');
  micAnalyser = ctx.createAnalyser(); micAnalyser.fftSize = 512;
  outGain = ctx.createGain(); outAnalyser = ctx.createAnalyser(); outAnalyser.fftSize = 512;
  outGain.connect(outAnalyser); outGain.connect(ctx.destination);
  await openMic();
  connect(false);
}

/* Coming back from the lock screen or another app: wake the audio graph, re-open a mic
   the OS may have closed, and take the wake lock again. */
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !document.body.classList.contains('live')) return;
  try { if (ctx && ctx.state !== 'running') await ctx.resume(); } catch {}
  try { if (micStream && micStream.getTracks().some(t => t.readyState === 'ended')) { micStream.getTracks().forEach(t => t.stop()); await openMic(); } } catch {}
  keepAwake();
});

function hangUp(remote) {
  ended = true; wantHangup = true;
  clearTimeout(reconnectTimer); reconnectTimer = null;
  if (ws && ws.readyState === 1 && !remote) ws.send(JSON.stringify({ type: 'hangup' }));
  try { workletNode?.disconnect(); micStream?.getTracks().forEach(t => t.stop()); } catch {}
  clearInterval(timerIv); cancelAnimationFrame(raf); releaseAwake();
  setTimeout(() => { try { ctx?.close(); } catch {} root.style.setProperty('--lamp', 0); root.style.setProperty('--mic', 0); document.body.classList.remove('speaking'); }, 1200);
  document.body.classList.remove('live', 'thinking', 'reconnecting'); document.body.classList.add('ended');
  const secs = Math.floor((Date.now() - startedAt) / 1000);
  setState(startedAt ? `line closed · ${fmt(secs)}` : 'the line is quiet');
  Object.keys(partial).forEach(k => { partial[k].classList.remove('partial'); delete partial[k]; });
  startedAt = 0;
}

$('lamp').onclick = () => { if (!document.body.classList.contains('live')) pickUp().catch(e => setState('error: ' + e.message.toLowerCase())); };
$('hang').onclick = () => hangUp(false);
$('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? 'unmute' : 'mute'; $('mute').classList.toggle('on', muted);
  ws?.send(JSON.stringify({ type: muted ? 'mute' : 'unmute' })); };
document.addEventListener('keydown', e => { if (e.code === 'Space' && !document.body.classList.contains('live') && e.target === document.body) { e.preventDefault(); $('lamp').click(); } });
</script>
