<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAGE TITLE — EXPLORABLE TITLE</title>
<link rel="stylesheet" href="../shared/explorable.css">
<link rel="stylesheet" href="../shared/theme.css">
</head>
<body data-page="PAGE_ID">
<main class="ex-page">
  <section class="ex-text">
    <h1>PAGE TITLE</h1>
    <p>The prose, written by the orchestrator from the storyboard card. Opens from where the
       parent page left off; explains this page's one idea in the persona's voice; names and
       defines any new term in the reader's terms.</p>
    <nav class="ex-next" aria-label="Where to go next">
      <a data-ex-link="NEXT_ID">What the next page is about, as a question or destination</a>
      <!-- a fork lists two or three; a side path says so: <a data-ex-link="…">… <small>side path · 3 pages</small></a> -->
    </nav>
    <div data-ex-fork-memory></div>
  </section>
  <section class="ex-stage" aria-label="What this visual shows, in one sentence">
    <!-- The visual chosen in the x-factor pass. One of:
         <figure><img src="../assets/…" alt="…"><figcaption>…</figcaption></figure>
         <svg viewBox="0 0 600 440" role="img" aria-label="…">…</svg>     (diagram / chart)
         <video src="../assets/…" controls muted playsinline></video>
         a playable (see build-guide §7) -->
  </section>
</main>

<script src="../shared/map.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/explorable.js"></script>
<!-- Only a playable page needs a script. Shared-model playables also load ../shared/model.js before explorable.js. -->
</body>
</html>
